<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI와 함께하는 스무고개 게임</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #e0f7fa; padding: 20px; }
        #chat-box { height: 60vh; background: white; border-radius: 15px; padding: 20px; overflow-y: auto; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 1.2em; line-height: 1.6; }
        .user-msg { color: #00695c; text-align: right; margin-bottom: 15px; font-weight: bold; }
        .bot-msg { color: #333; text-align: left; margin-bottom: 15px; background-color: #b2dfdb; padding: 15px; border-radius: 15px; display: inline-block; width: 85%; }
        .lang-badge { font-weight: bold; color: #00796b; }
        input { width: 75%; padding: 15px; font-size: 1.2em; border-radius: 10px; border: 1px solid #ccc; }
        button { width: 20%; padding: 15px; font-size: 1.2em; background-color: #00897b; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #004d40;">🤔 두근두근 스무고개 게임</h1>
    <div id="chat-box"></div>
    <div style="display: flex; justify-content: space-between;">
        <input type="text" id="user-input" placeholder="정답을 맞히기 위한 질문을 던져보세요!" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">보내기</button>
    </div>

    <script>
        // ⚠️ 여기에 진짜 API 키를 넣으세요!
        const API_KEY = "AQ.Ab8RN6JULjgvJte0vyS6uVUmUd_8xDdH6UdPOCHS8d6f4lHHHg"; 
        const chatBox = document.getElementById('chat-box');

        // 선생님의 요청에 맞춰 수정된 프롬프트 (랜덤성 강화, 힌트 삭제, 범위 확장)
        const systemPrompt = `[역할 부여]
너는 지금부터 초등학교 3학년 학생들(총 9명)과 스무고개 게임을 진행하는 친절하고 다정한 진행자야.

[게임 규칙]
1. 정답 설정: 초등학교 3학년이 알 만한 세상의 모든 일반적이고 익숙한 단어(예: 사자, 피자, 소방관, 구름, 연필, 냉장고 등) 중 하나를 '완벽하게 무작위(랜덤)'로 정해. 특정 주제에 집착하지 말고 동물, 식물, 음식, 직업, 자연, 물건 등 범위를 아주 넓게 가져가.
2. 범주 제시: 게임을 시작할 때 반드시 정답의 '큰 범주(예: 동물, 음식, 직업, 자연, 물건 등)'를 먼저 말해 줘.
3. 질문에 따른 피드백 규칙 (매우 중요: 무조건 칭찬하지 마! 상황에 따라 다르게 반응해):
   - 일반적인 질문: 가볍고 담백하게 "네, 맞아요.", "아니오.", "때에 따라 달라요." 정도로만 대답해.
   - 의미가 없거나 게임과 무관한 엉뚱한 질문: 칭찬하지 말고, "음, 그건 정답을 찾는 데 큰 도움이 안 될 것 같아요. 다른 특징을 물어볼까요?"라며 부드럽게 질문 방향을 고쳐줘.
4. 언어 배려: 서툰 한국어나 단어 하나만 툭 던지는 질문(예: "먹어?", "학교?")이 들어와도 찰떡같이 의도를 파악해서 대답해 줘. 의미 파악이 어렵다면 "혹시 ~를 물어본 걸까요?"라고 부드럽게 되물어 줘.

[출력 형식 및 다국어 지원 (매우 중요)]
네가 대답할 때는 반드시 아래의 3단계 형식과 언어 규칙을 지켜서 출력해 줘.
[한국어] 위 게임 규칙에 맞춘 한국어 대답.
[Uzbek] 한국어 원문보다 훨씬 더 간단하고 기초적인 단어와 짧은 문장으로 요약한 우즈베크어(Uzbek) 번역.
[Bengali] 한국어 원문과 비슷한 수준과 길이로 자연스럽게 번역한 벵골어(Bengali) 번역.`;

        let chatHistory = [];

        // 🌟 첫인사에서 완전히 무작위로 범주를 고르도록 강력하게 지시
        window.onload = () => {
            fetchAI("안녕! 스무고개 게임을 시작하자. 세상의 수많은 단어(동물, 식물, 물건, 음식, 직업 등) 중 완벽하게 랜덤으로 하나를 정한 다음, 다른 말은 하지 말고 '제가 정답을 하나 생각했어요! 이번 정답의 범주는 [네가 정한 범주]입니다. 첫 번째 질문을 해볼까요?'라고 첫인사를 건네줘. 매번 똑같은 범주가 나오지 않게 무작위로 골라줘! 3가지 언어로 번역해서 출력하는 것도 잊지 마.", true);
        };

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            chatBox.innerHTML += `<div class="user-msg">🧑 질문: ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            await fetchAI(text, false);
        }

        async function fetchAI(text, isFirstMessage) {
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            
            if (isFirstMessage) {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">🎤 진행자가 정답을 고르고 있어요...</div>`;
            } else {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">🎤 진행자 확인 중...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: chatHistory
                    })
                });
                
                if (response.status === 429) {
                    document.getElementById('loading').remove();
                    chatBox.innerHTML += `<div class="bot-msg" style="color:#d84315;">🎤 앗! 질문이 한꺼번에 쏟아져서 잘 못 들었어요! 10초만 기다렸다가 다시 질문해 줄래요?</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    chatHistory.pop();
                    return;
                }

                const data = await response.json();
                document.getElementById('loading').remove();
                
                const reply = data.candidates[0].content.parts[0].text;
                chatHistory.push({ role: "model", parts: [{ text: reply }] });
                
                let formattedReply = reply.replace(/\n/g, '<br>');
                formattedReply = formattedReply.replace(/\[한국어\]/g, '<span class="lang-badge">[한국어]</span>');
                formattedReply = formattedReply.replace(/\[Uzbek\]/g, '<br><span class="lang-badge">[Uzbek]</span>');
                formattedReply = formattedReply.replace(/\[Bengali\]/g, '<br><span class="lang-badge">[Bengali]</span>');

                chatBox.innerHTML += `<div class="bot-msg">🎤 진행자: <br><br>${formattedReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="bot-msg" style="color:red;">앗, 통신이 잠시 끊겼나 봐요. 새로고침 해주세요!</div>`;
            }
        }
    </script>
</body>
</html>
